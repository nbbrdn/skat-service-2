name: skat-service-prod

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skat}
      POSTGRES_USER: ${POSTGRES_USER:-skat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  web:
    image: skat-service-web:prod
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-service.skatpower.ru}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://service.skatpower.ru}
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-3600}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      DATABASE_ENGINE: postgresql
      POSTGRES_DB: ${POSTGRES_DB:-skat}
      POSTGRES_USER: ${POSTGRES_USER:-skat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-30}
      GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-30}
    ports:
      - "127.0.0.1:18080:8000"
    networks: [default, database]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

networks:
  database:
    internal: true

volumes:
  postgres_data:
